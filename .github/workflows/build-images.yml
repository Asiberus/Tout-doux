name: Build images

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      version:
        description: Semantic version stamped on the images
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to rebuild (e.g. 0.8.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/asiberus/tout-doux

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          CALL_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # A manual run never republishes `latest`. Rebuilding an older version
          # would otherwise roll production back on the server's next poll.
          if [ "$EVENT" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
            ref="v$version"
            latest=false
          else
            version="$INPUT_VERSION"
            ref="$CALL_REF"
            latest=true
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: \"$version\". Expected X.Y.Z"
            exit 1
          fi

          front="$IMAGE_PREFIX-frontend:$version"
          back="$IMAGE_PREFIX-backend:$version"
          if [ "$latest" = true ]; then
            front="$front"$'\n'"$IMAGE_PREFIX-frontend:latest"
            back="$back"$'\n'"$IMAGE_PREFIX-backend:latest"
          fi

          {
            echo "ref=$ref"
            echo "version=$version"
            echo "front_tags<<TAGS"
            echo "$front"
            echo "TAGS"
            echo "back_tags<<TAGS"
            echo "$back"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

          echo "Building $version from $ref (latest=$latest)"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.params.outputs.ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.conf/production/backend/Dockerfile
          push: true
          tags: ${{ steps.params.outputs.back_tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.params.outputs.version }}
            org.opencontainers.image.revision=${{ steps.params.outputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.conf/production/frontend/Dockerfile
          push: true
          build-args: |
            ARG_VERSION=${{ steps.params.outputs.version }}
          tags: ${{ steps.params.outputs.front_tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.params.outputs.version }}
            org.opencontainers.image.revision=${{ steps.params.outputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
